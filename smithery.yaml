# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml

startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      instagramAccessToken:
        type: string
        description: Instagram user or system-user token (Facebook Login); accounts are discovered from it
      instagramUserId:
        type: string
        description: Optional default Instagram Business/Creator account ID
      threadsAccessToken:
        type: string
        description: Default Threads API access token
      threadsUserId:
        type: string
        description: Default Threads user ID
      whatsappAccessToken:
        type: string
        description: WhatsApp Cloud API system-user token; numbers are discovered from it
      allowedAccounts:
        type: string
        description: Comma-separated accounts that write tools may target (default all)
      metaAppId:
        type: string
        description: Meta App ID (for token/webhook tools)
      metaAppSecret:
        type: string
        description: Meta App Secret (for token/webhook tools)
  commandFunction:
    |-
    config => ({ command: 'npx', args: ['-y', 'github:felipebarbosavasconcelos13-coder/meta-mcp-organico'], env: { INSTAGRAM_ACCESS_TOKEN: config.instagramAccessToken || '', INSTAGRAM_USER_ID: config.instagramUserId || '', THREADS_ACCESS_TOKEN: config.threadsAccessToken || '', THREADS_USER_ID: config.threadsUserId || '', WHATSAPP_ACCESS_TOKEN: config.whatsappAccessToken || '', META_ALLOWED_ACCOUNTS: config.allowedAccounts || '', META_APP_ID: config.metaAppId || '', META_APP_SECRET: config.metaAppSecret || '' } })
